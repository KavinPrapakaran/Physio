{% extends 'base.html' %}
{% block content %}
<div class="page-header"><h2>{{ form_title }}</h2></div>
<form method="post" class="form-grid">
    <div class="field"><label>Full Name<input type="text" name="full_name" value="{{ staff_user.full_name if staff_user else '' }}" required></label></div>
    <div class="field"><label>Username<input type="text" name="username" value="{{ staff_user.username if staff_user else '' }}" required></label></div>
    <div class="field"><label>Department<input type="text" name="department" value="{{ staff_user.department if staff_user else '' }}"></label></div>
    <div class="field"><label>Role<select name="role_id">
        {% for role in roles %}
        <option value="{{ role.id }}" {% if staff_user and staff_user.role_id == role.id %}selected{% endif %}>{{ role.name }}</option>
        {% endfor %}
    </select></label></div>
    <div class="field"><label>Password{% if staff_user %}<small>Leave blank to keep unchanged</small>{% endif %}<input type="password" name="password" {% if not staff_user %}required{% endif %}></label></div>
    <div class="buttons full-width"><button type="submit" class="primary-btn">Save</button><a href="{{ url_for('staff_list') }}" class="secondary-btn">Cancel</a></div>
</form>
{% endblock %}
