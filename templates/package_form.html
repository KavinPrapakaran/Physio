{% extends 'base.html' %}
{% block content %}
<div class="page-header"><h2>{{ form_title }}</h2></div>
<form method="post" class="form-grid">
    <div class="field"><label>Package Name<input type="text" name="name" value="{{ package.name if package else '' }}" required></label></div>
    <div class="field"><label>Price<input type="number" step="0.01" name="price" value="{{ package.price if package else '' }}" required></label></div>
    <div class="field"><label>Session Count<input type="number" name="session_count" value="{{ package.session_count if package else '' }}" required></label></div>
    <div class="field"><label>Validity Days<input type="number" name="validity_days" value="{{ package.validity_days if package else '' }}" required></label></div>
    <div class="field"><label>Is Active<select name="is_active"><option value="1" {% if package and package.is_active %}selected{% endif %}>Active</option><option value="0" {% if package and not package.is_active %}selected{% endif %}>Inactive</option></select></label></div>
    <div class="field full-width"><label>Description<textarea name="description">{{ package.description if package else '' }}</textarea></label></div>
    <div class="buttons full-width"><button type="submit" class="primary-btn">Save</button><a href="{{ url_for('packages') }}" class="secondary-btn">Cancel</a></div>
</form>
{% endblock %}
